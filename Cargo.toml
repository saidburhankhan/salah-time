[package]
name = "salah"
version = "0.1.0"
edition = "2024"
description = "Offline prayer times for the Omarchy bar"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
strip = true
lto = true
codegen-units = 1
